# Dependabot = an OPTIONAL helper that opens pull requests when a dependency or a GitHub
# Action has a new version. It never changes main by itself: CI tests every PR, you merge
# (or turn on the opt-in auto-merge: repository variable AUTO_MERGE_DEPENDABOT=yes, handled by
# the last job of ci.yml). The monitor does NOT need it to run. See docs/DEPENDABOT.md.
#
# No custom labels on purpose: Dependabot then uses its default "dependencies" label and
# creates it automatically (custom labels must exist in the repo first).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    # requirements.txt uses ranges (aiohttp>=3.14.3,<4) and every run already installs the newest
    # allowed release, so only open a PR when a release falls OUTSIDE the range (a new major).
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(python)"
    groups:
      python-deps:              # one PR for all Python bumps instead of one per package
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns: ["*"]
